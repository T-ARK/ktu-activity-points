name: CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pydantic pytest hypothesis mypy ruff import-linter

      - name: Run rules-check
        run: |
          python scripts/rules_check.py

      - name: Run lint
        run: |
          ruff check .
          mypy --strict scripts/rules_check.py

      - name: Run unit tests
        run: |
          pytest -v backend/tests/unit
